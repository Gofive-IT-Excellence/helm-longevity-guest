:root{--navy:#061b3a;--green:#007f62;--green-dark:#006e55;--muted:#6f809a;--line:#e5ebea;--soft:#eef8f1;--body:#f7faf9}
*{box-sizing:border-box}html,body{font-weight:300;margin:0;min-height:100%;background:#fff;color:var(--navy);font-family:KanitLocal,Arial,sans-serif}
strong,b,h1,h2,h3,button{font-weight:400}button,input{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible{outline:3px solid #7bc8b5;outline-offset:3px}
svg{display:block;flex:none}img{display:block;max-width:100%}
.shell{min-height:100vh;display:grid;grid-template-columns:246px minmax(0,1fr)}
.sidebar{position:sticky;top:0;height:100vh;padding:30px 20px;border-right:1px solid var(--line);background:#fff}
.brand{width:174px;margin:8px 0 39px 6px}
.side-nav{display:grid;gap:6px}.side-nav button{display:flex;align-items:center;gap:13px;width:100%;padding:12px 14px;border:0;border-radius:12px;color:#62758c;background:transparent;text-align:left;font-size:15px;font-weight:400}
.side-nav button svg{width:21px;height:21px}.side-nav button.active{background:#e9f6ee;color:var(--green)}
.sidebar-note{position:absolute;left:23px;right:23px;bottom:25px;padding-top:16px;border-top:1px solid var(--line);color:#8795a6;font-size:12px;line-height:1.6}
.workspace{min-width:0;background:#fff}.topbar{height:93px;padding:0 48px;border-bottom:1px solid #edf1f0;display:flex;align-items:center;justify-content:space-between}
.topbar-title{font-size:14px;font-weight:400;letter-spacing:.01em}.topbar-right{display:flex;align-items:center;gap:18px;color:var(--muted);font-size:13px}
.shift-pill{display:inline-flex;align-items:center;gap:7px;background:#e8f7e9;color:#173f4b;border-radius:100px;padding:7px 12px;font-weight:400}
.shift-pill .icon{color:#efb320}.shift-pill svg{width:18px;height:18px}
main{max-width:1210px;margin:0 auto;padding:34px 48px 72px}
.page-intro{margin:0 0 22px}.eyebrow{margin:0;color:var(--green);font-size:13px;font-weight:400}.page-intro h1{font-size:32px;line-height:1.22;margin:5px 0 3px;letter-spacing:-.02em}.page-intro p{color:var(--muted);font-size:14px;margin:0}
.hero{display:grid;grid-template-columns:minmax(330px,.85fr) minmax(400px,1.15fr);gap:20px;align-items:stretch}
.hero-copy{border-radius:22px;background:var(--green);color:#fff;min-height:320px;padding:36px;display:flex;flex-direction:column;justify-content:space-between}
.hero-copy .hero-symbol{width:52px;height:52px}.hero-copy h2{font-size:31px;margin:14px 0 4px;line-height:1.25}.hero-copy p{font-size:15px;opacity:.87;margin:0 0 22px}
.hero-action{display:inline-flex;align-items:center;justify-content:space-between;gap:12px;width:100%;max-width:330px;padding:12px 15px;border:0;border-radius:12px;background:#fff;color:var(--green);font-weight:400}
.hero-action svg{width:21px;height:21px}.hero-photo{width:100%;height:320px;object-fit:cover;border-radius:22px}
.overview-grid{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(315px,.85fr);gap:20px;margin-top:22px}
.panel{min-width:0;border:1px solid var(--line);border-radius:20px;background:#fff;padding:24px}
.panel-header{display:flex;align-items:flex-start;gap:13px}.round-icon{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:#e2f6e6;color:var(--green)}.round-icon svg{width:24px;height:24px}
.panel-heading{min-width:0}.panel-heading h2{font-size:21px;margin:0;line-height:1.3}.panel-heading p{font-size:14px;color:var(--muted);margin:2px 0 0}.panel-heading p strong{color:var(--green);font-size:26px}
.edit-button{margin-left:auto;display:inline-flex;align-items:center;gap:6px;border:1px solid var(--green);border-radius:100px;background:#fff;color:var(--green);padding:7px 11px;font-size:12px;font-weight:400;white-space:nowrap}.edit-button svg{width:16px;height:16px}
.nutrients{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));margin-top:24px}
.nutrient{display:flex;align-items:center;gap:12px;min-width:0;padding:0 15px;border-right:1px solid var(--line)}.nutrient:first-child{padding-left:0}.nutrient:last-child{padding-right:0;border-right:0}
.nutri-icon{width:39px;height:39px;flex:none;border-radius:50%;display:grid;place-items:center}.nutri-icon svg{width:23px;height:23px}.protein{background:#ffe9e5;color:#de5649}.carbs{background:#fff2d7;color:#e1a52a}.fat{background:#e2f1ff;color:#2188d4}
.nutrient span.label{display:block;color:var(--muted);font-size:12px;white-space:nowrap}.nutrient strong{display:block;font-size:24px;line-height:1.2}.nutrient strong small{font-size:13px;color:var(--muted);font-weight:400}
.estimate{margin:22px 0 0;padding-top:12px;border-top:1px solid var(--line);color:#8594a5;font-size:12px}
.activity-panel{background:#f0f9f2;border-color:#f0f9f2}.activity-panel .panel-header{align-items:center}.activity-text{font-size:15px;margin:16px 0 2px;font-weight:400}.activity-sub{font-size:13px;color:var(--muted);margin:0}
.activity-actions{display:flex;gap:10px;margin-top:22px}.solid-button,.ghost-button{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 16px;border-radius:11px;font-weight:400;font-size:13px}.solid-button{border:1px solid var(--green);background:var(--green);color:#fff}.solid-button:hover{background:var(--green-dark)}.ghost-button{border:1px solid var(--green);background:#fff;color:var(--green)}.solid-button svg,.ghost-button svg{width:18px;height:18px}
.subpage{max-width:930px}.section-title{font-size:22px;margin:30px 0 14px}.history{width:100%;display:flex;align-items:center;gap:17px;padding:12px;border:1px solid var(--line);border-radius:15px;background:#fff;text-align:left}.history img{width:108px;height:86px;border-radius:10px;object-fit:cover}.history span{display:grid;gap:5px}.history strong{font-size:16px}.history small{color:var(--muted);font-size:13px}.history>.icon{margin-left:auto;color:var(--muted)}
.review-grid{display:grid;grid-template-columns:minmax(0,.8fr) minmax(0,1.2fr);gap:26px}.review-grid>img{width:100%;height:310px;object-fit:cover;border-radius:18px}
.review-form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}.field{display:grid;gap:5px;color:#52657b;font-size:13px;font-weight:400}.field.full{grid-column:1/-1}.field input{width:100%;border:1px solid #d6e2e0;border-radius:10px;padding:11px 12px;color:var(--navy);background:#fff}.review-form .solid-button{grid-column:1/-1;margin-top:5px}
.notice{padding:11px 13px;border-radius:10px;background:#edf8f3;color:#446c62;font-size:12px;margin:0 0 17px}
.activity-choice{max-width:570px;border:1px solid var(--line);border-radius:18px;padding:27px}.activity-choice h2{font-size:27px;margin:9px 0 3px}.activity-choice p{color:var(--muted);font-size:14px}
.profile-row{display:flex;justify-content:space-between;gap:15px;padding:18px 0;border-bottom:1px solid var(--line);font-size:14px}.profile-row span{color:var(--muted)}.profile-row strong{text-align:right}
.mobile-brand,.bottom-nav{display:none}

/* Brand refresh: match the blue-to-cyan HELM Longevity icon. */
:root{--navy:#103365;--green:#0869ed;--green-dark:#0756ca;--coral:#20bdf0;--muted:#687fa4;--line:#e1ebf8;--soft:#edf7ff;--body:#f6faff;--sky:#25bdf1;--ink:#102c5d}
html,body{background:#f6faff;color:var(--ink)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #50ccfa;outline-offset:3px}
.shell,.workspace{background:#f6faff}
.workspace{background:radial-gradient(circle at 83% 0%,#dff7ff 0,transparent 31%),radial-gradient(circle at 10% 20%,#ecf3ff 0,transparent 34%),#f6faff}
.sidebar{background:#fff;border-right:1px solid #e4eefb;box-shadow:8px 0 30px #075ac308}

.side-nav button:hover{background:#f0f8ff;color:#075bd5;transform:translateX(2px)}
.side-nav button.active{background:linear-gradient(92deg,#e6f5ff,#f1f7ff);color:#075bd5;box-shadow:inset 3px 0 #0b82ed}
.sidebar-note{border-color:#e5effb;color:#7890b0}
.topbar{background:#ffffffeb;border-color:#e7effa;backdrop-filter:blur(12px)}
.topbar-title{color:#174477;font-weight:400}.topbar-right{color:#738ba9}
.shift-pill{background:#e8f5ff;color:#076bdb;border:1px solid #d6ebff}
.shift-pill .icon{color:#f0ad24}
main{padding-top:35px;padding-bottom:84px}
.eyebrow{color:#0879e6;letter-spacing:.055em;font-size:11px;font-weight:400}
.page-intro h1{color:#102e61;letter-spacing:-.04em;font-weight:400}

.summary-card{background:#fff;border:1px solid #e2edfb;border-radius:26px;box-shadow:0 14px 35px #0a61c510}

.metric-row strong{color:#075ccf}.calorie-foot{border-color:#e5eef8;color:#6983a6}

.hero-copy>*{position:relative;z-index:1}.hero-copy .hero-symbol{background:#ffffff22;border:1px solid #ffffff5c;box-shadow:inset 0 1px #ffffff50;border-radius:18px}
.hero-copy h2{letter-spacing:-.04em;font-weight:400}.hero-copy p{opacity:.95}
.hero-action{color:#0862d9;background:#fff;border-radius:15px;box-shadow:0 8px 22px #094dac30}
.hero-action:hover{background:#e8f8ff}

.hero-media .hero-photo{object-fit:cover}.camera-shade{background:linear-gradient(180deg,transparent 54%,#0a285c9c)}
.camera-overlay{color:#075fd5;box-shadow:0 8px 26px #092a5770}.camera-overlay svg{color:#0986e7}.camera-overlay:hover{background:#eaf8ff}
.panel{background:#fff;border:1px solid #e2ecfa;border-radius:23px;box-shadow:0 12px 30px #105cba0d}
.panel-heading h2,.section-head h2{color:#13376c;font-weight:400;letter-spacing:-.025em}
.panel-heading p strong,.review-kcal strong{color:#075fd8}
.round-icon,.water-symbol,.weight-symbol{background:#e6f5ff;color:#0782e4}
.edit-button{border-color:#bfdefb;color:#086bd8}.edit-button:hover{background:#eff8ff}
.nutrition-card .macro{border:1px solid #e9f0fb;background:#f7fbff;border-radius:17px}
.macro-mark.coral,.nutri-icon.protein{background:#e4f8ff;color:#0da7d7}

.water-card{background:linear-gradient(145deg,#eef8ff,#f7fcff);border-color:#e0f0fc}
.water-value,.steps-number{color:#0769dd}.water-track{background:#dceefb}.water-track span{background:linear-gradient(90deg,#0875e9,#2cc8f0)}
.water-actions button{border-color:#b8def9;color:#076bd9}.water-actions button:hover{background:#e6f5ff}
.move-card{background:linear-gradient(145deg,#fff,#f0f9ff);border-color:#e0effb}
.move-symbol,.activity-panel .round-icon{background:#dff6ff;color:#089bdb}
.move-card p strong,.move-plan{color:#075fcc}.text-link{color:#076bd9}
.streak-card{background:linear-gradient(145deg,#fff,#f1f8ff)}
.streak-count,.streak-day.hit{color:#0a85dc}.weight-card{background:#f5f9ff}.weight-value{color:#154987}
.activity-panel{background:linear-gradient(130deg,#eef9ff,#f7fcff);border-color:#dfeffa;box-shadow:0 11px 29px #0b80ca0e}
.activity-panel .panel-heading p{color:#728fac}.activity-panel .activity-text{color:#164b88}
.solid-button{background:linear-gradient(110deg,#075bdc,#138fe9);border-color:#0766df;box-shadow:0 7px 18px #0a6adc2a}
.solid-button:hover{background:linear-gradient(110deg,#064cc1,#087ddd)}
.ghost-button{border-color:#b7d9fb;color:#076bd9}.ghost-button:hover{background:#ecf7ff}
.quick-actions{gap:10px}.quick-actions button{background:#fff;border:1px solid #d8eafa;color:#086bd9;border-radius:13px;box-shadow:0 7px 19px #126ac10c;min-height:43px}
.quick-actions button:hover{background:#eff9ff;border-color:#addcff}
.quick-actions button[data-action="voice-food"]{color:#0b87ce;border-color:#ccecff}
.meal-entry,.history,.activity-choice{border-color:#e0ecfa;border-radius:18px;box-shadow:0 9px 23px #126ac10b}
.meal-entry .kcal{color:#066ad9}.meal-entry:hover,.food-pick:hover{background:#f5fbff;border-color:#a9d9fb}
.meal-entry .meal-symbol{background:#e9f7ff;color:#0784dd}
.notice{background:#eaf7ff;color:#376b9b}.food-pick,.review-item,.review-summary{border-color:#dfeafa}
.review-summary,.review-macros div{background:#fff}.review-macros div{border:1px solid #e7eff9}
.review-item button{color:#086bd9}.review-total strong{color:#075fd8}
.steps-card{background:linear-gradient(130deg,#eef8ff,#f5fbff);border-color:#d8ebfb}.steps-form button{background:#0876e5}
.modal{border:1px solid #e0ecfa;box-shadow:0 25px 75px #0b326638}.modal-list button{border-color:#e0ebf9}.modal-list button:first-child{background:linear-gradient(115deg,#075edf,#17a6ed);border-color:#0879e6}
.toast{background:#0a5ed2;box-shadow:0 9px 30px #063c9180}
.camera-bottom .shutter{background:#0c80ed;box-shadow:0 0 0 3px #0c80edaa}.camera-top button{background:#082a61a8}
.food-search:focus{border-color:#0b8ee8}
@media(max-width:760px){
  html,body,.workspace{background:#f6faff}
  .mobile-brand{background:#ffffffed;border-bottom:1px solid #e0edfb;box-shadow:0 5px 17px #1b75c50a}
  .mobile-brand .brand-lockup{gap:9px}.mobile-brand .brand-lockup img{width:43px;height:43px;box-shadow:0 5px 12px #086ae22a}

  .summary-card{border-radius:21px;box-shadow:0 11px 26px #0b6cce13}
  .hero-copy{background:linear-gradient(122deg,#0755d6,#0b86ed 66%,#20bdf0);border-radius:20px;box-shadow:0 12px 27px #075fd533}
  .hero-copy .hero-symbol{border-radius:14px}
  .hero-copy .hero-action{color:#0869e4;background:#fff}.hero-media{border-radius:20px;box-shadow:0 13px 26px #0d5fa329}

const MASCOTS={home:"assets/mascot-home-m1.png",thumbs:"assets/mascot-thumbs-up.png",thinking:"assets/mascot-thinking.png",review:"assets/mascot-health-card.png",wheel:"assets/mascot-wheel-push.png"};
function hydrateMascots(root=document){root.querySelectorAll("[data-mascot]").forEach(el=>{el.src=MASCOTS[el.dataset.mascot]||""})}
const STORAGE_KEY="helm-longevity-standalone-v1";
const defaults={tab:"today",name:"ข้าวกะเพราไก่ไข่ดาว",portion:"1 จาน",kcal:"620",protein:"28",carbs:"72",fat:"22",activity:"เดินเร็ว",duration:20,when:"หลังเลิกกะ",activityDone:false,photo:null,saved:false};
let state={...defaults};
try{state={...defaults,...JSON.parse(localStorage.getItem(STORAGE_KEY)||"{}")}}catch{}
const $=s=>document.querySelector(s);
const icon=(n,cls="")=>(ICONS[n]||"").replace("<svg ","<svg class=\""+cls+"\" ");
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const picture=()=>state.photo||MEAL;
function persist(){try{localStorage.setItem(STORAGE_KEY,JSON.stringify(state))}catch{}}
function navHTML(){return [["today","home","วันนี้"],["food","food","อาหาร"],["wheel","wheel","กินอะไรดี"],["activity","run","กิจกรรม"],["profile","user","ฉัน"]].map(([key,ic,label])=>`<button type="button" data-action="nav" data-tab="${key}" class="${state.tab===key?"active":""}" aria-current="${state.tab===key?"page":"false"}">${icon(ic)}<span>${label}</span></button>`).join("")}
function header(title,sub){return `<div class="page-intro"><p class="eyebrow">HELM LONGEVITY</p><h1>${title}</h1><p>${sub}</p></div>`}
function home(){return `
  ${header("สุขภาพวันนี้","ดูแลตัวเองได้ง่าย ๆ ในทุกกะงาน")}
  <section class="hero"><div class="hero-copy"><div class="hero-symbol">${icon("camera")}</div><div><h2>ถ่ายรูปอาหาร</h2><p>วิเคราะห์โภชนาการทันที</p><button class="hero-action" data-action="scan"><span>เริ่มบันทึกมื้ออาหาร</span>${icon("right")}</button></div></div><img class="hero-photo" src="${picture()}" alt="ข้าวกะเพราไก่ ไข่ดาว และแตงกวา"></section>
  <div class="overview-grid"><section class="panel"><div class="panel-header"><span class="round-icon">${icon("food")}</span><div class="panel-heading"><h2>มื้อกลางวัน</h2><p>ประมาณ <strong>${esc(state.kcal)}</strong> kcal</p></div><button class="edit-button" data-action="edit">${icon("edit")} แก้ไขรายการ</button></div><div class="nutrients">
  <div class="nutrient"><span class="nutri-icon protein">${icon("egg")}</span><div><span class="label">โปรตีน</span><strong>${esc(state.protein)} <small>g</small></strong></div></div>
  <div class="nutrient"><span class="nutri-icon carbs">${icon("grains")}</span><div><span class="label">คาร์โบไฮเดรต</span><strong>${esc(state.carbs)} <small>g</small></strong></div></div>
  <div class="nutrient"><span class="nutri-icon fat">${icon("drop")}</span><div><span class="label">ไขมัน</span><strong>${esc(state.fat)} <small>g</small></strong></div></div></div><p class="estimate">ผลสารอาหารเป็นค่าประมาณและแก้ไขได้ • ข้อมูลตัวอย่างรอเชื่อม HELM AI</p></section>
  <section class="panel activity-panel"><div class="panel-header"><span class="round-icon">${icon("run")}</span><div class="panel-heading"><h2>กิจกรรมวันนี้</h2><p>แผนที่เข้ากับวันทำงานของคุณ</p></div></div><p class="activity-text">${esc(state.activity)} ${esc(state.duration)} นาที${esc(state.when)}</p><p class="activity-sub">${state.activityDone?"ทำสำเร็จแล้ววันนี้":"ช่วยเสริมสุขภาพและความสดชื่น"}</p><div class="activity-actions"><button class="solid-button" data-action="activity-plan">ดูแผน ${icon("right")}</button><button class="ghost-button" data-action="done">${icon(state.activityDone?"check":"clock")} ${state.activityDone?"ทำสำเร็จแล้ว":"บันทึกว่าทำแล้ว"}</button></div></section></div>`}
function food(){return `<div class="subpage">${header("อาหารของฉัน","บันทึกและดูสารอาหารในแต่ละมื้อ")}<button class="solid-button" data-action="scan">${icon("camera")} ถ่ายรูปอาหาร</button><h2 class="section-title">วันนี้</h2><button class="history" data-action="edit"><img src="${picture()}" alt="มื้อกลางวัน"><span><strong>${esc(state.name)}</strong><small>มื้อกลางวัน • ประมาณ ${esc(state.kcal)} kcal</small></span><span class="icon">${icon("right")}</span></button><p class="estimate">แตะมื้ออาหารเพื่อตรวจหรือแก้ไขรายการ</p></div>`}
function activity(){return `<div class="subpage">${header("แผนกิจกรรม","ขยับตัวให้เข้ากับตารางกะของคุณ")}<div class="activity-choice"><span class="round-icon">${icon("run")}</span><p class="eyebrow">แนะนำสำหรับวันนี้</p><h2>${esc(state.activity)} ${esc(state.duration)} นาที</h2><p>${esc(state.when)} • ปรับกิจกรรมให้ตรงกับเวลาที่สะดวกได้</p><div class="activity-actions"><button class="solid-button" data-action="done">${icon(state.activityDone?"check":"clock")} ${state.activityDone?"ทำสำเร็จแล้ว":"บันทึกว่าทำแล้ว"}</button><button class="ghost-button" data-action="activity-plan">เปลี่ยนกิจกรรม</button></div></div><p class="estimate">แผนนี้เป็นตัวอย่างสำหรับต้นแบบ สามารถปรับตามความพร้อมของแต่ละคน</p></div>`}
function profile(){return `<div class="subpage">${header("ข้อมูลของฉัน","เป้าหมายและความเป็นส่วนตัว")}<div class="profile-row"><span>ตารางกะ</span><strong>กะเช้า 08:00–17:00</strong></div><div class="profile-row"><span>เป้าหมาย</span><strong>ดูแลสุขภาพระยะยาว</strong></div><div class="profile-row"><span>AI ของบริษัท</span><strong>รอเชื่อม HELM</strong></div><div class="profile-row"><span>การจัดเก็บ</span><strong>ในเบราว์เซอร์เครื่องนี้</strong></div><p class="estimate">ข้อมูลในไฟล์นี้เก็บเฉพาะบนเครื่องของคุณ ไม่มีการส่งไปยังเซิร์ฟเวอร์</p></div>`}
function review(){return `<div class="subpage">${header("ตรวจผลก่อนบันทึก","แก้ชื่ออาหาร ปริมาณ และสารอาหารได้")}<p class="notice">ผลตัวอย่างสำหรับต้นแบบ • ยังไม่ได้เชื่อมต่อ HELM AI</p><div class="review-grid"><img src="${picture()}" alt="รูปอาหารที่เลือก"><form id="review-form" class="review-form"><label class="field full">ชื่ออาหาร<input name="name" value="${esc(state.name)}" required></label><label class="field full">ปริมาณ<input name="portion" value="${esc(state.portion)}" required></label><label class="field">พลังงาน (kcal)<input name="kcal" type="number" min="0" value="${esc(state.kcal)}" required></label><label class="field">โปรตีน (กรัม)<input name="protein" type="number" min="0" value="${esc(state.protein)}" required></label><label class="field">คาร์โบไฮเดรต (กรัม)<input name="carbs" type="number" min="0" value="${esc(state.carbs)}" required></label><label class="field">ไขมัน (กรัม)<input name="fat" type="number" min="0" value="${esc(state.fat)}" required></label><button class="solid-button" type="submit">${icon("check")} บันทึกมื้ออาหาร</button></form></div></div>`}
function render(){const showingReview=state.tab==="review";$("#main").innerHTML=showingReview?review():({today:home,food,wheel:wheelPage,activity,profile}[state.tab]||home)();$("#side-nav").innerHTML=navHTML();$("#bottom-nav").innerHTML=navHTML();document.querySelectorAll("[data-icon]").forEach(e=>e.innerHTML=icon(e.dataset.icon));hydrateMascots();document.title="HELM Longevity";window.scrollTo(0,0)}
function modal(title,sub,body){$("#modal-root").innerHTML=`<div class="modal" role="dialog" aria-modal="true" aria-label="${title}"><div class="modal-header"><div><h2>${title}</h2><p>${sub}</p></div><button class="icon-button" data-action="close" aria-label="ปิด">${icon("close")}</button></div>${body}</div>`}
function closeModal(){$("#modal-root").innerHTML=""}
function toast(message){$("#toast-root").innerHTML=`<div class="toast" role="status">${message}</div>`;setTimeout(()=>$("#toast-root").innerHTML="",2600)}
document.addEventListener("click",e=>{const b=e.target.closest("[data-action]");if(!b){if(e.target.id==="modal-root")closeModal();return}const a=b.dataset.action;
 if(a==="nav"){state.tab=b.dataset.tab;persist();render()}else if(a==="scan"){modal("ถ่ายรูปอาหาร","เพิ่มมื้ออาหารจากรูป",`<div class="modal-list"><button data-action="camera-live">${icon("camera")} เปิดกล้องถ่ายรูป</button><button data-action="choose-photo">${icon("upload")} เลือกรูปจากเครื่อง</button><button data-action="sample">${icon("food")} ใช้รูปตัวอย่าง</button></div><p class="modal-help">หลังถ่ายรูป ให้เลือกหรือกรอกอาหารในจานด้วยตนเอง ระหว่างรอเชื่อม HELM AI</p>`)}
 else if(a==="close")closeModal();else if(a==="choose-photo")$("#gallery-input").click();else if(a==="sample"){state.photo=null;state.tab="review";closeModal();render()}
 else if(a==="edit"){state.tab="review";render()}else if(a==="activity-plan"){modal("เลือกกิจกรรม","เลือกสิ่งที่ทำได้ตามเวลาของคุณ",`<div class="modal-list">${[["เดินเร็ว",20,"หลังเลิกกะ"],["ยืดเหยียด",15,"ช่วงพัก"],["เวทเบา ๆ",20,"หลังเลิกกะ"]].map((v,i)=>`<button data-action="select-activity" data-index="${i}">${icon("run")}<span>${v[0]} ${v[1]} นาที<small>${v[2]}</small></span></button>`).join("")}</div>`)}
 else if(a==="select-activity"){const v=[["เดินเร็ว",20,"หลังเลิกกะ"],["ยืดเหยียด",15,"ช่วงพัก"],["เวทเบา ๆ",20,"หลังเลิกกะ"]][Number(b.dataset.index)];state.activity=v[0];state.duration=v[1];state.when=v[2];state.activityDone=false;state.tab="activity";persist();closeModal();render()}
 else if(a==="done"){state.activityDone=!state.activityDone;persist();render();toast(state.activityDone?"บันทึกกิจกรรมแล้ว":"ยกเลิกการบันทึกกิจกรรมแล้ว")}

profile=function(){return `<div class="subpage">${header("ข้อมูลของฉัน","เป้าหมายและการติดตามสุขภาพ")}${weightCard()}<form class="wellness-form" id="weight-form"><label>น้ำหนักล่าสุด (kg)<input name="weightKg" type="number" min="20" max="400" step="0.1" value="${state.weightKg==null?"":num(state.weightKg)}" required></label><label>เป้าหมายน้ำหนัก (kg)<input name="weightGoalKg" type="number" min="20" max="400" step="0.1" value="${state.weightGoalKg==null?"":num(state.weightGoalKg)}" required></label><button class="solid-button" type="submit">บันทึกน้ำหนัก</button></form><form class="wellness-form" id="shift-form"><label>ตารางกะ<select name="shift">${["กะเช้า","กะบ่าย","กะดึก","ไม่ระบุ"].map(x=>`<option value="${x}" ${state.shift===x?"selected":""}>${x}</option>`).join("")}</select></label><button class="solid-button" type="submit">บันทึกกะ</button></form><form class="wellness-form" id="goal-form"><label>เป้าหมายพลังงานต่อวัน (kcal)<input name="goal" type="number" min="500" max="5000" value="${num(state.goal)}" required></label><button class="solid-button" type="submit">บันทึกเป้าหมาย</button></form><form class="wellness-form" id="water-goal-form"><label>เป้าหมายน้ำดื่มต่อวัน (ml)<input name="waterGoalMl" type="number" min="250" max="10000" step="250" value="${num(state.waterGoalMl)}" required></label><button class="solid-button" type="submit">บันทึกเป้าหมาย</button></form><div class="connect-card"><h2>เชื่อมข้อมูลสุขภาพ</h2><p>Apple Health และ Health Connect ต้องใช้แอปมือถือพร้อมสิทธิ์จากผู้ใช้ เว็บไฟล์ในเครื่องนี้ยังเชื่อมไม่ได้</p><div><span>HELM AI ของบริษัท</span><strong>รอเชื่อมหลังบ้าน</strong></div><div><span>ข้อมูลในต้นแบบ</span><strong>เก็บในเบราว์เซอร์เครื่องนี้</strong></div></div><p class="estimate">เป้าหมายเริ่มต้นเป็นตัวอย่าง โปรดปรับให้เหมาะกับตัวคุณ</p></div>`};
review=function(){const items=state.draftItems||[],sum=k=>items.reduce((n,x)=>n+num(x[k]),0),formatNut=(k,unit)=>items.length&&items.every(x=>x[k]!==null&&x[k]!==undefined&&String(x[k]).trim()!==""&&Number.isFinite(Number(x[k])))?sum(k).toLocaleString("th-TH",{maximumFractionDigits:1})+" "+unit:"—";return `<div class="subpage meal-review">${header("ตรวจมื้ออาหาร","ตรวจวัตถุดิบและสารอาหารก่อนบันทึก")}<div class="mascot-review-note"><img data-mascot="review" alt="น้อง HELM ถือการ์ดสุขภาพ"><div><strong>ตรวจอาหารในจานก่อนบันทึก</strong><p>รูปยังไม่ได้วิเคราะห์ด้วย HELM AI กรุณาเลือกหรือแก้ไขวัตถุดิบด้วยตนเอง</p></div></div><div class="review-photo-wrap"><img class="review-photo" src="${picture()}" alt="รูปอาหารที่กำลังบันทึก"><div class="review-photo-actions"><button type="button" class="solid-button" data-action="review-camera">${icon("camera")} ${state.photo?"ถ่ายรูปใหม่":"ถ่ายรูปอาหาร"}</button><button type="button" class="ghost-button" data-action="review-gallery">${icon("upload")} เลือกรูป</button></div></div><section class="review-summary" aria-label="ตารางแคลอรีและสารอาหาร"><div class="review-kcal"><span>🔥 แคลอรีโดยประมาณ</span><strong>${formatNut("kcal","kcal")}</strong></div><div class="review-macros"><div><span>🍞 คาร์บ</span><strong>${formatNut("carbs","ก.")}</strong></div><div><span>🥩 โปรตีน</span><strong>${formatNut("protein","ก.")}</strong></div><div><span>🧀 ไขมัน</span><strong>${formatNut("fat","ก.")}</strong></div><div><span>🍬 น้ำตาล</span><strong>${formatNut("sugar","ก.")}</strong></div><div><span>🧂 โซเดียม</span><strong>${formatNut("sodium","มก.")}</strong></div><div><span>💛 คอเลสเตอรอล</span><strong>${formatNut("cholesterol","มก.")}</strong></div></div><p class="review-nutrition-note">ค่าประมาณจากอาหารที่เลือกเอง • — คือยังไม่มีข้อมูล</p></section><section class="panel ingredient-panel"><div class="section-head"><div><span class="eyebrow">INGREDIENTS</span><h2>อาหารในจาน</h2></div><strong>${items.length} รายการ</strong></div><div class="review-items">${items.length?items.map((x,i)=>`<div class="review-item"><span><strong>${esc(x.name)}</strong><small>${num(x.protein)} g โปรตีน · ${num(x.carbs)} g คาร์บ · ${num(x.fat)} g ไขมัน</small></span><span><strong>${num(x.kcal)} kcal</strong><button data-action="edit-part" data-index="${i}">แก้ไข</button><button data-action="remove-part" data-index="${i}" aria-label="ลบ ${esc(x.name)}">ลบ</button></span></div>`).join(""):`<div class="empty-note">เพิ่มอาหารในจานเพื่อคำนวณสารอาหาร</div>`}</div><button class="ghost-button" data-action="add-part">+ เพิ่มอาหารในจาน</button></section><form id="food-review-form" class="review-save"><label>ชื่อมื้ออาหาร<input name="name" value="${esc(state.draftName||"มื้ออาหารใหม่")}" required></label><label>ประเภทมื้อ<input name="time" value="${esc(state.draftTime||"มื้อกลางวัน")}" required></label><button class="solid-button" type="submit" ${items.length?"":"disabled"}>${icon("check")} บันทึกมื้ออาหาร</button></form></div>`};
document.addEventListener("click",e=>{const b=e.target.closest("[data-action]");if(!b)return;const a=b.dataset.action;if(a==="water"){state.tab="today";persist();render();$("#water-card")?.scrollIntoView({behavior:"smooth",block:"center"})}else if(a==="water-goal"){modal("เป้าหมายน้ำดื่ม","กำหนดเป้าหมายที่เหมาะกับคุณ",`<form class="wellness-form" id="water-goal-form"><label>เป้าหมายต่อวัน (ml)<input name="waterGoalMl" type="number" min="250" max="10000" step="250" value="${num(state.waterGoalMl)}" required></label><button class="solid-button" type="submit">บันทึกเป้าหมาย</button></form>`)}else if(a==="add-water"||a==="remove-water"){state.waterMl=Math.max(0,num(state.waterMl)+(a==="add-water"?250:-250));if(a==="add-water"&&state.waterReminderEnabled)scheduleWaterReminder();persist();render();$("#water-card")?.scrollIntoView({block:"center"});toast("บันทึกน้ำดื่มแล้ว")}});
document.addEventListener("submit",e=>{const id=e.target.id;if(!["activity-kcal-form","weight-form","water-goal-form","shift-form"].includes(id))return;e.preventDefault();const fd=new FormData(e.target);if(id==="activity-kcal-form"){state.activityKcal=num(fd.get("activityKcal"));state.activityDone=true;toast("บันทึกพลังงานจากกิจกรรมแล้ว")}else if(id==="weight-form"){state.weightKg=num(fd.get("weightKg"));state.weightGoalKg=num(fd.get("weightGoalKg"));state.weightHistory.push({date:new Date().toISOString(),kg:state.weightKg});toast("บันทึกน้ำหนักแล้ว")}else if(id==="water-goal-form"){state.waterGoalMl=Math.max(250,num(fd.get("waterGoalMl")));closeModal();toast("บันทึกเป้าหมายน้ำแล้ว")}else if(id==="shift-form"){state.shift=String(fd.get("shift")||"ไม่ระบุ");document.querySelectorAll(".shift-pill").forEach(el=>{el.lastChild.textContent=state.shift});toast("บันทึกกะงานแล้ว")}persist();render()});

ICONS.wheel='<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 256 256" fill="none" stroke="currentColor" stroke-width="16" stroke-linecap="round"><circle cx="128" cy="128" r="91"/><circle cx="128" cy="128" r="15"/><path d="M128 37v76m0 30v76M37 128h76m30 0h76M64 64l53 53m22 22 53 53M192 64l-53 53m-22 22-53 53"/></svg>';
const WHEEL_MEALS=[
 {name:"ข้าวกะเพราไก่",emoji:"🌶️",items:["ข้าวสวย","กะเพราไก่"]},
 {name:"ข้าวมันไก่",emoji:"🍗",items:["ข้าวมันไก่"]},
 {name:"ข้าวผัดหมู",emoji:"🍚",items:["ข้าวผัดหมู"]},
 {name:"ข้าวไข่เจียว",emoji:"🍳",items:["ข้าวไข่เจียว"]},
 {name:"ผัดซีอิ๊วหมู",emoji:"🍜",items:["ผัดซีอิ๊วหมู"]},
 {name:"ข้าวต้มหมู",emoji:"🥣",items:["ข้าวต้มหมู"]}
];
const WHEEL_POSITIONS=[[64,23],[79,50],[64,77],[36,77],[21,50],[36,23]];
let wheelRotation=0,wheelResultIndex=-1,wheelSpinning=false;
const wheelItem=name=>FOOD_DB.find(item=>item.name===name);
const wheelEnergy=meal=>meal.items.reduce((sum,name)=>sum+num(wheelItem(name)?.kcal),0);
function wheelResultHTML(){if(wheelResultIndex<0)return "";const meal=WHEEL_MEALS[wheelResultIndex];return `<div class="wheel-result-heading"><img class="mascot-win" data-mascot="thumbs" alt="น้อง HELM ยกนิ้วให้"><div><span class="eyebrow">ผลที่สุ่มได้ ${meal.emoji} ✨</span><h2>${esc(meal.name)}</h2></div></div><p>พลังงานตัวอย่างประมาณ ${wheelEnergy(meal)} kcal ต่อมื้อ • ตรวจปริมาณจริงก่อนบันทึก</p><div class="wheel-result-actions"><button class="solid-button" data-action="wheel-camera">${icon("camera")} ซื้อแล้วถ่ายรูปเมนูนี้</button><button class="ghost-button" data-action="wheel-gallery">${icon("upload")} เลือกรูปจากคลัง</button><button class="ghost-button" data-action="wheel-log">ตรวจและบันทึก</button><button class="ghost-button" data-action="spin-wheel">หมุนอีกครั้ง</button></div>`}
function wheelPage(){return `<div class="subpage wheel-page"><div class="wheel-intro"><div>${header("วันนี้กินอะไรดี","คิดไม่ออก ลองหมุนวงล้อเลือกเมนู")}<p class="wheel-lead">เมนูตัวอย่าง 6 อย่างสำหรับมื้ออาหารในวันทำงาน</p></div><img data-mascot="thinking" alt="น้อง HELM กำลังคิดเมนู"></div>
 <section class="wheel-stage ${wheelSpinning?"is-spinning":wheelResultIndex>=0?"is-finished":""}" aria-label="วงล้อสุ่มเมนูอาหาร"><div class="wheel-host"><div class="wheel-host-copy"><span class="wheel-kicker">✨ ไอเดียมื้ออร่อย</span><h2 class="wheel-stage-title">หมุนเลย มื้อนี้กินอะไรดี?</h2></div></div><div class="wheel-wrap"><span class="wheel-choice-halo" aria-hidden="true"></span><div class="wheel-mascot"><img data-mascot="wheel" alt="น้อง HELM ชี้นิ้วเลือกเมนูบนวงล้อ"></div><div id="roulette-wheel" class="roulette-wheel" style="--label-counter:${-wheelRotation}deg;transform:rotate(${wheelRotation}deg)" role="img" aria-label="วงล้อมีเมนูอาหารหกอย่าง">${WHEEL_MEALS.map((m,i)=>`<span class="wheel-slice ${i===0||i===5?"":"dark-text"}" style="left:${WHEEL_POSITIONS[i][0]}%;top:${WHEEL_POSITIONS[i][1]}%"><span class="food-emoji" aria-hidden="true">${m.emoji}</span><span class="food-name">${esc(m.name)}</span></span>`).join("")}</div></div><button id="wheel-spin" class="wheel-spin" data-action="spin-wheel" ${wheelSpinning?"disabled":""}>${wheelSpinning?"กำลังหมุน…":wheelResultIndex>=0?"หมุนอีกครั้ง":"ให้น้อง HELM หมุน 🎲"}</button><span id="wheel-status" class="sr-only" aria-live="polite">${wheelSpinning?"กำลังหมุนวงล้อ":""}</span></section>
 <section id="wheel-result" class="wheel-result" aria-live="polite" ${wheelResultIndex<0?"hidden":""}>${wheelResultHTML()}</section><p class="wheel-note">วงล้อสุ่มเพื่อช่วยคิดเมนู ไม่ได้เลือกตามโรคประจำตัวหรือข้อจำกัดอาหารของคุณ • พลังงานเป็นค่าประมาณจากรายการตัวอย่าง</p></div>`}
document.addEventListener("click",e=>{const button=e.target.closest("[data-action]");if(!button)return;
 if(button.dataset.action==="review-camera"){$("#photo-input").click();return}
  if(button.dataset.action==="review-gallery"){$("#gallery-input").click();return}
  if(button.dataset.action==="spin-wheel"){
  if(wheelSpinning)return;
  const selected=Math.floor(Math.random()*WHEEL_MEALS.length),center=(selected+.5)*60;
  const desired=(160-center+360)%360,current=((wheelRotation%360)+360)%360;
  wheelRotation+=360*3+(desired-current+360)%360;
  wheelSpinning=true;wheelResultIndex=-1;
  const disk=$("#roulette-wheel"),spin=$("#wheel-spin"),result=$("#wheel-result"),status=$("#wheel-status"),stage=$(".wheel-stage");
  if(stage){stage.classList.remove("is-finished");stage.classList.add("is-spinning")}if(result){result.hidden=true;result.innerHTML=""}if(spin){spin.disabled=true;spin.textContent="กำลังหมุน…"}if(status)status.textContent="กำลังหมุนวงล้อ";
  requestAnimationFrame(()=>{if(disk)disk.style.transform=`rotate(${wheelRotation}deg)`});
  const reduced=window.matchMedia?.("(prefers-reduced-motion: reduce)")?.matches;
  setTimeout(()=>{wheelResultIndex=selected;wheelSpinning=false;const box=$("#wheel-result"),spinButton=$("#wheel-spin"),live=$("#wheel-status"),wheel=$("#roulette-wheel");if(wheel)wheel.style.setProperty("--label-counter",`${-wheelRotation}deg`);if(stage){stage.classList.remove("is-spinning");stage.classList.add("is-finished")}if(box){box.innerHTML=wheelResultHTML();hydrateMascots(box);box.hidden=false}if(spinButton){spinButton.disabled=false;spinButton.textContent="หมุนอีกครั้ง"}if(live)live.textContent=`ผลที่สุ่มได้ ${WHEEL_MEALS[selected].name}`},reduced?60:3300);
 }else if((button.dataset.action==="wheel-log"||button.dataset.action==="wheel-camera"||button.dataset.action==="wheel-gallery")&&wheelResultIndex>=0){
  const meal=WHEEL_MEALS[wheelResultIndex];state.editIndex=-1;state.draftItems=meal.items.map(name=>({...wheelItem(name)}));state.draftName=meal.name;state.draftTime="มื้อกลางวัน";state.photo=null;state.tab="review";persist();render();if(button.dataset.action==="wheel-camera")$("#photo-input").click();else if(button.dataset.action==="wheel-gallery")$("#gallery-input").click();
 }
});
