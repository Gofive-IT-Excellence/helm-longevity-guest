:root{--navy:#061b3a;--green:#007f62;--green-dark:#006e55;--muted:#6f809a;--line:#e5ebea;--soft:#eef8f1;--body:#f7faf9}
*{box-sizing:border-box}html,body{font-weight:300;margin:0;min-height:100%;background:#fff;color:var(--navy);font-family:KanitLocal,Arial,sans-serif}
strong,b,h1,h2,h3,button{font-weight:400}button,input{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible{outline:3px solid #7bc8b5;outline-offset:3px}
svg{display:block;flex:none}img{display:block;max-width:100%}
.shell{min-height:100vh;display:grid;grid-template-columns:246px minmax(0,1fr)}
.sidebar{position:sticky;top:0;height:100vh;padding:30px 20px;border-right:1px solid var(--line);background:#fff}
.brand{width:174px;margin:8px 0 39px 6px}
.side-nav{display:grid;gap:6px}.side-nav button{display:flex;align-items:center;gap:13px;width:100%;padding:12px 14px;border:0;border-radius:12px;color:#62758c;background:transparent;text-align:left;font-size:15px;font-weight:400}
.side-nav button svg{width:21px;height:21px}.side-nav button.active{background:#e9f6ee;color:var(--green)}
.sidebar-note{position:absolute;left:23px;right:23px;bottom:25px;padding-top:16px;border-top:1px solid var(--line);color:#8795a6;font-size:12px;line-height:1.6}
.workspace{min-width:0;background:#fff}.topbar{height:93px;padding:0 48px;border-bottom:1px solid #edf1f0;display:flex;align-items:center;justify-content:space-between}
.topbar-title{font-size:14px;font-weight:400;letter-spacing:.01em}.topbar-right{display:flex;align-items:center;gap:18px;color:var(--muted);font-size:13px}
.shift-pill{display:inline-flex;align-items:center;gap:7px;background:#e8f7e9;color:#173f4b;border-radius:100px;padding:7px 12px;font-weight:400}
.shift-pill .icon{color:#efb320}.shift-pill svg{width:18px;height:18px}
main{max-width:1210px;margin:0 auto;padding:34px 48px 72px}
.page-intro{margin:0 0 22px}.eyebrow{margin:0;color:var(--green);font-size:13px;font-weight:400}.page-intro h1{font-size:32px;line-height:1.22;margin:5px 0 3px;letter-spacing:-.02em}.page-intro p{color:var(--muted);font-size:14px;margin:0}
.hero{display:grid;grid-template-columns:minmax(330px,.85fr) minmax(400px,1.15fr);gap:20px;align-items:stretch}
.hero-copy{border-radius:22px;background:var(--green);color:#fff;min-height:320px;padding:36px;display:flex;flex-direction:column;justify-content:space-between}
.hero-copy .hero-symbol{width:52px;height:52px}.hero-copy h2{font-size:31px;margin:14px 0 4px;line-height:1.25}.hero-copy p{font-size:15px;opacity:.87;margin:0 0 22px}
.hero-action{display:inline-flex;align-items:center;justify-content:space-between;gap:12px;width:100%;max-width:330px;padding:12px 15px;border:0;border-radius:12px;background:#fff;color:var(--green);font-weight:400}
.hero-action svg{width:21px;height:21px}.hero-photo{width:100%;height:320px;object-fit:cover;border-radius:22px}
.overview-grid{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(315px,.85fr);gap:20px;margin-top:22px}
.panel{min-width:0;border:1px solid var(--line);border-radius:20px;background:#fff;padding:24px}
.panel-header{display:flex;align-items:flex-start;gap:13px}.round-icon{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:#e2f6e6;color:var(--green)}.round-icon svg{width:24px;height:24px}
.panel-heading{min-width:0}.panel-heading h2{font-size:21px;margin:0;line-height:1.3}.panel-heading p{font-size:14px;color:var(--muted);margin:2px 0 0}.panel-heading p strong{color:var(--green);font-size:26px}
.edit-button{margin-left:auto;display:inline-flex;align-items:center;gap:6px;border:1px solid var(--green);border-radius:100px;background:#fff;color:var(--green);padding:7px 11px;font-size:12px;font-weight:400;white-space:nowrap}.edit-button svg{width:16px;height:16px}
.nutrients{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));margin-top:24px}
.nutrient{display:flex;align-items:center;gap:12px;min-width:0;padding:0 15px;border-right:1px solid var(--line)}.nutrient:first-child{padding-left:0}.nutrient:last-child{padding-right:0;border-right:0}
.nutri-icon{width:39px;height:39px;flex:none;border-radius:50%;display:grid;place-items:center}.nutri-icon svg{width:23px;height:23px}.protein{background:#ffe9e5;color:#de5649}.carbs{background:#fff2d7;color:#e1a52a}.fat{background:#e2f1ff;color:#2188d4}
.nutrient span.label{display:block;color:var(--muted);font-size:12px;white-space:nowrap}.nutrient strong{display:block;font-size:24px;line-height:1.2}.nutrient strong small{font-size:13px;color:var(--muted);font-weight:400}
.estimate{margin:22px 0 0;padding-top:12px;border-top:1px solid var(--line);color:#8594a5;font-size:12px}
.activity-panel{background:#f0f9f2;border-color:#f0f9f2}.activity-panel .panel-header{align-items:center}.activity-text{font-size:15px;margin:16px 0 2px;font-weight:400}.activity-sub{font-size:13px;color:var(--muted);margin:0}
.activity-actions{display:flex;gap:10px;margin-top:22px}.solid-button,.ghost-button{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 16px;border-radius:11px;font-weight:400;font-size:13px}.solid-button{border:1px solid var(--green);background:var(--green);color:#fff}.solid-button:hover{background:var(--green-dark)}.ghost-button{border:1px solid var(--green);background:#fff;color:var(--green)}.solid-button svg,.ghost-button svg{width:18px;height:18px}
.subpage{max-width:930px}.section-title{font-size:22px;margin:30px 0 14px}.history{width:100%;display:flex;align-items:center;gap:17px;padding:12px;border:1px solid var(--line);border-radius:15px;background:#fff;text-align:left}.history img{width:108px;height:86px;border-radius:10px;object-fit:cover}.history span{display:grid;gap:5px}.history strong{font-size:16px}.history small{color:var(--muted);font-size:13px}.history>.icon{margin-left:auto;color:var(--muted)}
.review-grid{display:grid;grid-template-columns:minmax(0,.8fr) minmax(0,1.2fr);gap:26px}.review-grid>img{width:100%;height:310px;object-fit:cover;border-radius:18px}
.review-form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}.field{display:grid;gap:5px;color:#52657b;font-size:13px;font-weight:400}.field.full{grid-column:1/-1}.field input{width:100%;border:1px solid #d6e2e0;border-radius:10px;padding:11px 12px;color:var(--navy);background:#fff}.review-form .solid-button{grid-column:1/-1;margin-top:5px}
.notice{padding:11px 13px;border-radius:10px;background:#edf8f3;color:#446c62;font-size:12px;margin:0 0 17px}
.activity-choice{max-width:570px;border:1px solid var(--line);border-radius:18px;padding:27px}.activity-choice h2{font-size:27px;margin:9px 0 3px}.activity-choice p{color:var(--muted);font-size:14px}
.profile-row{display:flex;justify-content:space-between;gap:15px;padding:18px 0;border-bottom:1px solid var(--line);font-size:14px}.profile-row span{color:var(--muted)}.profile-row strong{text-align:right}
.mobile-brand,.bottom-nav{display:none}

/* Brand refresh: match the blue-to-cyan HELM Longevity icon. */
:root{--navy:#103365;--green:#0869ed;--green-dark:#0756ca;--coral:#20bdf0;--muted:#687fa4;--line:#e1ebf8;--soft:#edf7ff;--body:#f6faff;--sky:#25bdf1;--ink:#102c5d}
html,body{background:#f6faff;color:var(--ink)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #50ccfa;outline-offset:3px}
.shell,.workspace{background:#f6faff}
.workspace{background:radial-gradient(circle at 83% 0%,#dff7ff 0,transparent 31%),radial-gradient(circle at 10% 20%,#ecf3ff 0,transparent 34%),#f6faff}
.sidebar{background:#fff;border-right:1px solid #e4eefb;box-shadow:8px 0 30px #075ac308}

.side-nav button:hover{background:#f0f8ff;color:#075bd5;transform:translateX(2px)}
.side-nav button.active{background:linear-gradient(92deg,#e6f5ff,#f1f7ff);color:#075bd5;box-shadow:inset 3px 0 #0b82ed}
.sidebar-note{border-color:#e5effb;color:#7890b0}
.topbar{background:#ffffffeb;border-color:#e7effa;backdrop-filter:blur(12px)}
.topbar-title{color:#174477;font-weight:400}.topbar-right{color:#738ba9}
.shift-pill{background:#e8f5ff;color:#076bdb;border:1px solid #d6ebff}
.shift-pill .icon{color:#f0ad24}
main{padding-top:35px;padding-bottom:84px}
.eyebrow{color:#0879e6;letter-spacing:.055em;font-size:11px;font-weight:400}
.page-intro h1{color:#102e61;letter-spacing:-.04em;font-weight:400}

.summary-card{background:#fff;border:1px solid #e2edfb;border-radius:26px;box-shadow:0 14px 35px #0a61c510}

.metric-row strong{color:#075ccf}.calorie-foot{border-color:#e5eef8;color:#6983a6}

.hero-copy>*{position:relative;z-index:1}.hero-copy .hero-symbol{background:#ffffff22;border:1px solid #ffffff5c;box-shadow:inset 0 1px #ffffff50;border-radius:18px}
.hero-copy h2{letter-spacing:-.04em;font-weight:400}.hero-copy p{opacity:.95}
.hero-action{color:#0862d9;background:#fff;border-radius:15px;box-shadow:0 8px 22px #094dac30}
.hero-action:hover{background:#e8f8ff}

.hero-media .hero-photo{object-fit:cover}.camera-shade{background:linear-gradient(180deg,transparent 54%,#0a285c9c)}
.camera-overlay{color:#075fd5;box-shadow:0 8px 26px #092a5770}.camera-overlay svg{color:#0986e7}.camera-overlay:hover{background:#eaf8ff}
.panel{background:#fff;border:1px solid #e2ecfa;border-radius:23px;box-shadow:0 12px 30px #105cba0d}
.panel-heading h2,.section-head h2{color:#13376c;font-weight:400;letter-spacing:-.025em}
.panel-heading p strong,.review-kcal strong{color:#075fd8}
.round-icon,.water-symbol,.weight-symbol{background:#e6f5ff;color:#0782e4}
.edit-button{border-color:#bfdefb;color:#086bd8}.edit-button:hover{background:#eff8ff}
.nutrition-card .macro{border:1px solid #e9f0fb;background:#f7fbff;border-radius:17px}
.macro-mark.coral,.nutri-icon.protein{background:#e4f8ff;color:#0da7d7}

.water-card{background:linear-gradient(145deg,#eef8ff,#f7fcff);border-color:#e0f0fc}
.water-value,.steps-number{color:#0769dd}.water-track{background:#dceefb}.water-track span{background:linear-gradient(90deg,#0875e9,#2cc8f0)}
.water-actions button{border-color:#b8def9;color:#076bd9}.water-actions button:hover{background:#e6f5ff}
.move-card{background:linear-gradient(145deg,#fff,#f0f9ff);border-color:#e0effb}
.move-symbol,.activity-panel .round-icon{background:#dff6ff;color:#089bdb}
.move-card p strong,.move-plan{color:#075fcc}.text-link{color:#076bd9}
.streak-card{background:linear-gradient(145deg,#fff,#f1f8ff)}
.streak-count,.streak-day.hit{color:#0a85dc}.weight-card{background:#f5f9ff}.weight-value{color:#154987}
.activity-panel{background:linear-gradient(130deg,#eef9ff,#f7fcff);border-color:#dfeffa;box-shadow:0 11px 29px #0b80ca0e}
.activity-panel .panel-heading p{color:#728fac}.activity-panel .activity-text{color:#164b88}
.solid-button{background:linear-gradient(110deg,#075bdc,#138fe9);border-color:#0766df;box-shadow:0 7px 18px #0a6adc2a}
.solid-button:hover{background:linear-gradient(110deg,#064cc1,#087ddd)}
.ghost-button{border-color:#b7d9fb;color:#076bd9}.ghost-button:hover{background:#ecf7ff}
.quick-actions{gap:10px}.quick-actions button{background:#fff;border:1px solid #d8eafa;color:#086bd9;border-radius:13px;box-shadow:0 7px 19px #126ac10c;min-height:43px}
.quick-actions button:hover{background:#eff9ff;border-color:#addcff}
.quick-actions button[data-action="voice-food"]{color:#0b87ce;border-color:#ccecff}
.meal-entry,.history,.activity-choice{border-color:#e0ecfa;border-radius:18px;box-shadow:0 9px 23px #126ac10b}
.meal-entry .kcal{color:#066ad9}.meal-entry:hover,.food-pick:hover{background:#f5fbff;border-color:#a9d9fb}
.meal-entry .meal-symbol{background:#e9f7ff;color:#0784dd}
.notice{background:#eaf7ff;color:#376b9b}.food-pick,.review-item,.review-summary{border-color:#dfeafa}
.review-summary,.review-macros div{background:#fff}.review-macros div{border:1px solid #e7eff9}
.review-item button{color:#086bd9}.review-total strong{color:#075fd8}
.steps-card{background:linear-gradient(130deg,#eef8ff,#f5fbff);border-color:#d8ebfb}.steps-form button{background:#0876e5}
.modal{border:1px solid #e0ecfa;box-shadow:0 25px 75px #0b326638}.modal-list button{border-color:#e0ebf9}.modal-list button:first-child{background:linear-gradient(115deg,#075edf,#17a6ed);border-color:#0879e6}
.toast{background:#0a5ed2;box-shadow:0 9px 30px #063c9180}
.camera-bottom .shutter{background:#0c80ed;box-shadow:0 0 0 3px #0c80edaa}.camera-top button{background:#082a61a8}
.food-search:focus{border-color:#0b8ee8}
@media(max-width:760px){
  html,body,.workspace{background:#f6faff}
  .mobile-brand{background:#ffffffed;border-bottom:1px solid #e0edfb;box-shadow:0 5px 17px #1b75c50a}
  .mobile-brand .brand-lockup{gap:9px}.mobile-brand .brand-lockup img{width:43px;height:43px;box-shadow:0 5px 12px #086ae22a}

  .summary-card{border-radius:21px;box-shadow:0 11px 26px #0b6cce13}
  .hero-copy{background:linear-gradient(122deg,#0755d6,#0b86ed 66%,#20bdf0);border-radius:20px;box-shadow:0 12px 27px #075fd533}
  .hero-copy .hero-symbol{border-radius:14px}
  .hero-copy .hero-action{color:#0869e4;background:#fff}.hero-media{border-radius:20px;box-shadow:0 13px 26px #0d5fa329}

activity=function(){return `<div class="subpage">${header("กิจกรรมของฉัน","บันทึกก้าวเดินและเลือกแผนที่เหมาะกับวันทำงาน")}<div class="steps-card"><h2>ก้าวเดินวันนี้</h2><div class="steps-number">${num(state.steps).toLocaleString()} <small>ก้าว</small></div><p>กรอกจำนวนก้าวจากมือถือหรืออุปกรณ์ของคุณด้วยตนเอง</p><form class="steps-form" id="steps-form"><input name="steps" type="number" min="0" step="1" value="${num(state.steps)}" aria-label="จำนวนก้าว" required><button type="submit">บันทึกก้าว</button></form></div><div class="activity-choice"><span class="round-icon">${icon("run")}</span><p class="eyebrow">แผนกิจกรรมตัวอย่าง</p><h2>${esc(state.activity)} ${esc(state.duration)} นาที</h2><p>${esc(state.when)} • เลือกเวลาที่เหมาะกับกำลังและตารางงานของคุณ</p><div class="activity-actions"><button class="solid-button" data-action="done">${icon(state.activityDone?"check":"clock")} ${state.activityDone?"ทำสำเร็จแล้ว":"บันทึกว่าทำแล้ว"}</button><button class="ghost-button" data-action="activity-plan">เปลี่ยนกิจกรรม</button></div></div><p class="estimate">กิจกรรมเป็นคำแนะนำทั่วไป ไม่ได้คำนวณให้ชดเชยอาหารที่กินโดยตรง</p></div>`};
profile=function(){return `<div class="subpage">${header("ข้อมูลของฉัน","ตั้งค่าเป้าหมายและดูการจัดเก็บข้อมูล")}<div class="profile-row"><span>ตารางกะ</span><strong>กะเช้า 08:00–17:00</strong></div><div class="profile-row"><span>AI ของบริษัท</span><strong>รอเชื่อม HELM</strong></div><div class="profile-row"><span>การจัดเก็บ</span><strong>ในเบราว์เซอร์เครื่องนี้</strong></div><form class="goal-form" id="goal-form"><label>เป้าหมายพลังงานต่อวัน (kcal)<input type="number" name="goal" min="500" max="5000" value="${num(state.goal)}" required></label><button class="solid-button" type="submit">บันทึก</button></form><p class="estimate">เป้าหมายเริ่มต้นเป็นตัวอย่าง กรุณาปรับตามคำแนะนำที่เหมาะกับตัวคุณ ข้อมูลไม่ถูกส่งจากไฟล์นี้</p></div>`};
review=function(){const total=state.draftItems.reduce((n,x)=>n+num(x.kcal),0);return `<div class="subpage">${header("ตรวจรายการอาหาร","ระบุอาหารในรูปและตรวจค่าประมาณก่อนบันทึก")}<p class="notice">รุ่นนี้ยังไม่รู้จำอาหารจากภาพ กรุณาเลือกหรือกรอกอาหารด้วยตนเอง • HELM AI จะเชื่อมในขั้นถัดไป</p><div class="review-grid"><img src="${picture()}" alt="รูปอาหารที่เลือก"><div><div class="review-items">${state.draftItems.length?state.draftItems.map((x,i)=>`<div class="review-item"><span><strong>${esc(x.name)}</strong><small>${num(x.protein)} g โปรตีน · ${num(x.carbs)} g คาร์บ · ${num(x.fat)} g ไขมัน</small></span><span><strong>${num(x.kcal)} kcal</strong><button data-action="edit-part" data-index="${i}">แก้ไข</button><button data-action="remove-part" data-index="${i}" aria-label="ลบ ${esc(x.name)}">ลบ</button></span></div>`).join(""):`<div class="empty-note">ยังไม่มีรายการอาหาร กดเพิ่มอาหารในจานเพื่อเริ่มต้น</div>`}</div><button class="ghost-button" data-action="add-part">+ เพิ่มอาหารในจาน</button><div class="review-total"><span>พลังงานรวมโดยประมาณ</span><strong>${total} kcal</strong></div><form id="food-review-form" class="review-form"><label class="field full">ชื่อมื้ออาหาร<input name="name" value="${esc(state.draftName||"มื้ออาหารใหม่")}" required></label><label class="field full">ประเภทมื้อ<input name="time" value="${esc(state.draftTime||"มื้อกลางวัน")}" required></label><button class="solid-button" type="submit" ${state.draftItems.length?"":"disabled"}>${icon("check")} บันทึกมื้ออาหาร</button></form></div></div></div>`};
function foodPicker(){modal("เพิ่มอาหารในจาน","ค้นหาอาหารไทย หรือกรอกอาหารเอง",`<input id="food-search" class="food-search" type="search" placeholder="ค้นหา เช่น กะเพรา ไข่เจียว" aria-label="ค้นหาอาหาร"><div class="food-grid">${FOOD_DB.map((x,i)=>`<button class="food-pick" data-action="pick-food" data-index="${i}"><strong>${esc(x.name)}</strong><small>ประมาณ ${x.kcal} kcal</small></button>`).join("")}</div><button class="ghost-button" data-action="custom-food">+ กรอกอาหารเอง</button><p class="modal-help">ตัวเลขในรายการเป็นค่าตัวอย่าง ต้องตรวจตามปริมาณจริง</p>`);$("#food-search")?.focus()}
function editPart(i){const x=i>=0?state.draftItems[i]:{name:"",kcal:0,protein:0,carbs:0,fat:0};modal(i>=0?"แก้ไขอาหาร":"เพิ่มอาหารเอง","ตรวจค่าตามปริมาณจริงก่อนบันทึก",`<form id="part-form" data-index="${i}" class="review-form"><label class="field full">ชื่ออาหาร<input name="name" value="${esc(x.name)}" required></label><label class="field">พลังงาน (kcal)<input name="kcal" type="number" min="0" value="${num(x.kcal)}" required></label><label class="field">โปรตีน (g)<input name="protein" type="number" min="0" value="${num(x.protein)}" required></label><label class="field">คาร์โบไฮเดรต (g)<input name="carbs" type="number" min="0" value="${num(x.carbs)}" required></label><label class="field">ไขมัน (g)<input name="fat" type="number" min="0" value="${num(x.fat)}" required></label><label class="field">น้ำตาล (g) ถ้ามีข้อมูล<input name="sugar" type="number" min="0" step="0.1" value="${esc(x.sugar??"")}" placeholder="ยังไม่มีข้อมูล"></label><label class="field">โซเดียม (mg) ถ้ามีข้อมูล<input name="sodium" type="number" min="0" step="0.1" value="${esc(x.sodium??"")}" placeholder="ยังไม่มีข้อมูล"></label><label class="field">คอเลสเตอรอล (mg) ถ้ามีข้อมูล<input name="cholesterol" type="number" min="0" step="0.1" value="${esc(x.cholesterol??"")}" placeholder="ยังไม่มีข้อมูล"></label><button class="solid-button" type="submit">บันทึกรายการ</button></form>`)}
function newMeal(withSample=false){state.editIndex=-1;state.draftItems=withSample?sampleParts():[];state.draftName=withSample?"ข้าวกะเพราไก่ไข่ดาว":"มื้ออาหารใหม่";state.draftTime="มื้อกลางวัน";state.photo=null;state.tab="review";persist();closeModal();render()}
document.addEventListener("click",e=>{const b=e.target.closest("[data-action]");if(!b)return;const a=b.dataset.action;
 if(a==="scan"){closeCamera();state.editIndex=-1;state.draftItems=[];state.draftName="มื้ออาหารใหม่";state.draftTime="มื้อกลางวัน";state.photo=null}
 else if(a==="nav"&&cameraStream)closeCamera();
 else if(a==="close")render();
 else if(a==="sample"){state.editIndex=-1;state.draftItems=sampleParts();state.draftName="ข้าวกะเพราไก่ไข่ดาว";state.draftTime="มื้อกลางวัน";state.photo=null;render()}
 else if(a==="text-food"){newMeal(false);foodPicker()}
 else if(a==="voice-food"){modal("บันทึกด้วยเสียง","ฟังก์ชันสำหรับขั้นเชื่อมต่อ HELM",`<p class="notice">ต้นแบบไฟล์ในเครื่องยังไม่แปลงเสียงเป็นข้อความ เพื่อไม่ส่งเสียงของพนักงานไปยังบริการภายนอก</p><button class="solid-button" data-action="text-food">เพิ่มอาหารด้วยข้อความแทน</button>`)}
 else if(a==="camera-live")openCamera();
 else if(a==="cancel-camera")closeCamera();
 else if(a==="flip-camera")openCamera(cameraFacing==="environment"?"user":"environment");
 else if(a==="capture-live"){const video=$("#camera-video");if(video?.videoWidth){const canvas=document.createElement("canvas");const ratio=Math.min(1,1000/Math.max(video.videoWidth,video.videoHeight));canvas.width=Math.round(video.videoWidth*ratio);canvas.height=Math.round(video.videoHeight*ratio);canvas.getContext("2d").drawImage(video,0,0,canvas.width,canvas.height);state.photo=canvas.toDataURL("image/jpeg",.76);state.tab="review";persist();closeModal();render();document.dispatchEvent(new Event("helm:photo-ready"))}else toast("กำลังเตรียมกล้อง กรุณาลองอีกครั้ง")}
 else if(a==="add-part")foodPicker();
 else if(a==="pick-food"){state.draftItems.push({...FOOD_DB[Number(b.dataset.index)]});persist();closeModal();render()}
 else if(a==="custom-food")editPart(-1);
 else if(a==="edit-part")editPart(Number(b.dataset.index));
 else if(a==="remove-part"){state.draftItems.splice(Number(b.dataset.index),1);persist();render()}
 else if(a==="open-meal"){const i=Number(b.dataset.index),m=state.meals[i];state.editIndex=i;state.draftItems=m.items.map(x=>({...x}));state.draftName=m.name;state.draftTime=m.time;state.photo=m.photo;state.tab="review";render()}
 else if(a==="steps"){state.tab="activity";persist();render();$(".steps-form input")?.focus()}
});
document.addEventListener("submit",e=>{const id=e.target.id;if(!["food-review-form","part-form","steps-form","goal-form"].includes(id))return;e.preventDefault();const fd=new FormData(e.target);
 if(id==="part-form"){const item={name:String(fd.get("name")||"").trim(),kcal:num(fd.get("kcal")),protein:num(fd.get("protein")),carbs:num(fd.get("carbs")),fat:num(fd.get("fat")),sugar:optionalNum(fd.get("sugar")),sodium:optionalNum(fd.get("sodium")),cholesterol:optionalNum(fd.get("cholesterol"))};const i=Number(e.target.dataset.index);if(i<0)state.draftItems.push(item);else state.draftItems[i]=item;persist();closeModal();render();toast("บันทึกรายการอาหารแล้ว")}
 if(id==="food-review-form"){const meal={name:String(fd.get("name")||"").trim(),time:String(fd.get("time")||"").trim(),photo:state.photo||null,items:state.draftItems.map(x=>({...x})),savedAt:new Date().toISOString()};if(state.editIndex>=0)state.meals[state.editIndex]=meal;else{if(state.meals.length===1&&state.meals[0].savedAt==="ตัวอย่าง")state.meals=[];state.meals.push(meal)}state.editIndex=-1;state.photo=null;state.tab="today";persist();render();toast("บันทึกมื้ออาหารแล้ว")}
 if(id==="steps-form"){state.steps=Math.round(num(fd.get("steps")));persist();render();toast("บันทึกก้าวเดินแล้ว")}
 if(id==="goal-form"){state.goal=Math.round(num(fd.get("goal")));persist();render();toast("บันทึกเป้าหมายแล้ว")}
});
document.addEventListener("input",e=>{if(e.target.id!=="food-search")return;const q=e.target.value.trim().toLocaleLowerCase("th-TH");document.querySelectorAll(".food-pick").forEach(b=>{b.hidden=!b.textContent.toLocaleLowerCase("th-TH").includes(q)})});

// Extra offline features inspired by the supplied workflow references.
state.waterMl=Number.isFinite(Number(state.waterMl))?num(state.waterMl):0;
state.waterGoalMl=Number.isFinite(Number(state.waterGoalMl))?Math.max(250,num(state.waterGoalMl)):2000;
// Local interval reminder. Background push on iPhone requires a separate installed PWA and push service.
const WATER_REMINDER_INTERVALS=[60,90,120,180];
state.waterReminderEnabled=state.waterReminderEnabled===true;
state.waterReminderMinutes=WATER_REMINDER_INTERVALS.includes(Number(state.waterReminderMinutes))?Number(state.waterReminderMinutes):120;
state.waterReminderNextAt=Number.isFinite(Number(state.waterReminderNextAt))?Number(state.waterReminderNextAt):0;
state.waterReminderDue=state.waterReminderDue===true;
if(state.waterReminderEnabled&&!state.waterReminderNextAt)state.waterReminderNextAt=Date.now()+state.waterReminderMinutes*60000;
function waterReminderStatus(){
 if(!state.waterReminderEnabled)return "ปิดการเตือนอยู่";
 if(num(state.waterMl)>=num(state.waterGoalMl))return "ถึงเป้าหมายน้ำดื่มวันนี้แล้ว";
 if(state.waterReminderDue)return "🔔 ถึงเวลาดื่มน้ำแล้ว";
 return "เตือนครั้งถัดไป "+new Intl.DateTimeFormat("th-TH",{hour:"2-digit",minute:"2-digit"}).format(new Date(state.waterReminderNextAt));
}
function updateWaterReminderAlert(){const root=$("#water-reminder-root");if(!root)return;root.innerHTML=state.waterReminderEnabled&&state.waterReminderDue&&num(state.waterMl)<num(state.waterGoalMl)?`<div class="water-reminder-alert" role="alert"><strong>💧 ได้เวลาดื่มน้ำแล้ว</strong><p>ดื่มน้ำสักแก้ว แล้วบันทึกไว้กับน้อง HELM</p><div class="water-reminder-alert-actions"><button type="button" data-action="water-reminder-log">บันทึก +250 ml</button><button type="button" data-action="water-reminder-snooze">เตือนอีก 15 นาที</button></div></div>`:""}
function scheduleWaterReminder(minutes=state.waterReminderMinutes){state.waterReminderDue=false;state.waterReminderNextAt=Date.now()+minutes*60000;persist();updateWaterReminderAlert()}
function checkWaterReminder(){if(!state.waterReminderEnabled||state.waterReminderDue||num(state.waterMl)>=num(state.waterGoalMl)||Date.now()<state.waterReminderNextAt)return;state.waterReminderDue=true;persist();updateWaterReminderAlert();if("Notification" in window&&Notification.permission==="granted"){try{const note=new Notification("HELM Longevity • เวลาดื่มน้ำ",{body:"ดื่มน้ำสักแก้ว แล้วบันทึก +250 ml ในแอป",tag:"helm-water-reminder"});note.onclick=()=>{window.focus();note.close()}}catch{}}}
document.addEventListener("click",async e=>{const b=e.target.closest("[data-action]");if(!b)return;const a=b.dataset.action;if(a==="water-reminder-toggle"){state.waterReminderEnabled=!state.waterReminderEnabled;if(state.waterReminderEnabled)scheduleWaterReminder();else{state.waterReminderDue=false;state.waterReminderNextAt=0;persist();updateWaterReminderAlert()}render();toast(state.waterReminderEnabled?"เปิดเตือนดื่มน้ำแล้ว":"ปิดเตือนดื่มน้ำแล้ว")}
 else if(a==="water-reminder-snooze"){scheduleWaterReminder(15);render();toast("จะเตือนอีกครั้งใน 15 นาที")}
 else if(a==="water-reminder-log"){state.waterMl=Math.max(0,num(state.waterMl)+250);scheduleWaterReminder();render();$("#water-card")?.scrollIntoView({block:"center"});toast("บันทึกน้ำ 250 ml แล้ว")}
 else if(a==="water-reminder-permission"&&"Notification" in window){try{const result=await Notification.requestPermission();render();toast(result==="granted"?"อนุญาตการแจ้งเตือนแล้ว":"ยังไม่ได้อนุญาตการแจ้งเตือน") }catch{toast("เบราว์เซอร์นี้ยังไม่รองรับการแจ้งเตือนระบบ")}}
});
document.addEventListener("change",e=>{if(e.target.id!=="water-reminder-frequency")return;state.waterReminderMinutes=Number(e.target.value);if(state.waterReminderEnabled)scheduleWaterReminder();else persist();render()});
document.addEventListener("visibilitychange",()=>{if(!document.hidden)checkWaterReminder()});
setInterval(checkWaterReminder,30000);

state.activityKcal=Number.isFinite(Number(state.activityKcal))?num(state.activityKcal):0;
state.weightKg=state.weightKg==null||state.weightKg===""?null:num(state.weightKg);
state.weightGoalKg=state.weightGoalKg==null||state.weightGoalKg===""?null:num(state.weightGoalKg);
state.weightHistory=Array.isArray(state.weightHistory)?state.weightHistory:[];
state.shift=["กะเช้า","กะบ่าย","กะดึก","ไม่ระบุ"].includes(state.shift)?state.shift:"ไม่ระบุ";
const localDay=d=>{const x=new Date(d);return Number.isNaN(x.getTime())?"":`${x.getFullYear()}-${String(x.getMonth()+1).padStart(2,"0")}-${String(x.getDate()).padStart(2,"0")}`};
const currentDay=()=>localDay(new Date());
if(state.trackerDate&&state.trackerDate!==currentDay()){state.waterMl=0;state.steps=0;state.activityKcal=0;state.activityDone=false}
state.trackerDate=currentDay();
persist();
const isToday=m=>m.savedAt==="ตัวอย่าง"||localDay(m.savedAt)===currentDay();
const todaysMeals=()=>state.meals.filter(isToday);
const dailyFood=()=>todaysMeals().reduce((n,m)=>n+mealTotal(m),0);
const loggedActivity=()=>state.activityDone?num(state.activityKcal):0;
const dailyMacro=()=>{const t={protein:0,carbs:0,fat:0};todaysMeals().forEach(m=>(m.items||[]).forEach(x=>Object.keys(t).forEach(k=>t[k]+=num(x[k]))));return t};
function streakCount(){const days=new Set(state.meals.filter(m=>m.savedAt!=="ตัวอย่าง").map(m=>localDay(m.savedAt)).filter(Boolean));let count=0;const d=new Date();if(!days.has(localDay(d)))d.setDate(d.getDate()-1);while(days.has(localDay(d))){count++;d.setDate(d.getDate()-1)}return count}
function streakDays(){const days=new Set(state.meals.filter(m=>m.savedAt!=="ตัวอย่าง").map(m=>localDay(m.savedAt)).filter(Boolean));return Array.from({length:7},(_,i)=>{const d=new Date();d.setDate(d.getDate()-(6-i));return `<span class="streak-day ${days.has(localDay(d))?"hit":""}"><b>${["อา","จ","อ","พ","พฤ","ศ","ส"][d.getDay()]}</b><i>${days.has(localDay(d))?"●":"○"}</i></span>`}).join("")}
summaryCard=function(){const food=dailyFood(),goal=Math.max(1,num(state.goal)),burn=loggedActivity(),left=Math.max(0,goal-food+burn),pct=Math.min(100,Math.round(food/goal*100));return `<section class="summary-card calorie-dashboard"><div class="summary-top"><span class="eyebrow">ภาพรวมวันนี้</span><span class="summary-date">${new Intl.DateTimeFormat("th-TH",{day:"numeric",month:"short"}).format(new Date())}</span></div><div class="calorie-main"><div class="summary-ring" style="--progress:${pct}%"><span><strong>${left.toLocaleString()}</strong><small>kcal คงเหลือ</small></span></div><div class="calorie-math"><h2>พลังงานของคุณ</h2><p>เป้าหมาย − อาหาร + กิจกรรม</p><div class="calorie-line"><span>เป้าหมาย</span><strong>${goal.toLocaleString()}</strong></div><div class="calorie-line"><span>อาหาร</span><strong>${food.toLocaleString()}</strong></div><div class="calorie-line"><span>กิจกรรม</span><strong>+${burn.toLocaleString()}</strong></div></div></div><div class="calorie-foot">${todaysMeals().length} มื้อที่บันทึก <span>•</span> ${num(state.steps).toLocaleString()} ก้าว</div></section>`};

function waterCard(){const goal=Math.max(250,num(state.waterGoalMl)),amount=num(state.waterMl),cups=Math.min(40,Math.max(1,Math.ceil(goal/250))),filled=Math.min(cups,Math.floor(amount/250));return `<section class="panel water-card" id="water-card"><div class="section-head"><div><span class="eyebrow">HYDRATION</span><h2>น้ำดื่ม</h2></div><button class="water-edit" data-action="water-goal" aria-label="แก้ไขเป้าหมายน้ำดื่ม">${icon("edit")}</button></div><div class="water-value">${amount.toLocaleString()} <small>ml</small></div><p class="water-goal">เป้าหมาย ${goal.toLocaleString()} ml</p><div class="water-cups" role="group" aria-label="บันทึกน้ำดื่ม แก้วละ 250 มิลลิลิตร">${Array.from({length:cups},(_,i)=>i<filled?`<span class="water-cup filled" aria-label="แก้วที่ ${i+1} บันทึกแล้ว"><span class="glass"></span></span>`:`<button class="water-cup empty" type="button" data-action="add-water" aria-label="เพิ่มน้ำ 250 มิลลิลิตร"><span class="glass"></span><b>+</b></button>`).join("")}</div><div class="water-actions"><button data-action="remove-water" aria-label="ลดน้ำ 250 มิลลิลิตร">− 250 ml</button><button data-action="add-water">+ 250 ml</button></div><div class="water-reminder-settings"><div class="water-reminder-top"><strong>🔔 เตือนดื่มน้ำ</strong><button type="button" class="water-reminder-toggle" data-action="water-reminder-toggle" aria-pressed="${state.waterReminderEnabled}">${state.waterReminderEnabled?"เปิดอยู่":"เปิดเตือน"}</button></div><label class="water-reminder-row">เตือนทุก <select id="water-reminder-frequency" aria-label="ช่วงเวลาเตือนดื่มน้ำ">${WATER_REMINDER_INTERVALS.map(m=>`<option value="${m}" ${state.waterReminderMinutes===m?"selected":""}>${m===60?"1 ชั่วโมง":m===90?"1 ชั่วโมงครึ่ง":m===120?"2 ชั่วโมง":"3 ชั่วโมง"}</option>`).join("")}</select></label><p class="water-reminder-status">${waterReminderStatus()}</p>${state.waterReminderEnabled&&"Notification" in window&&Notification.permission==="default"?`<button type="button" class="water-reminder-permission" data-action="water-reminder-permission">อนุญาตแจ้งเตือนของเบราว์เซอร์</button>`:""}<p class="water-reminder-note">พรีวิวเตือนเมื่อเปิดเว็บอยู่ • การเตือนตอนปิดเว็บบน iPhone ต้องเชื่อม Web Push เพิ่ม</p></div></section>`}

review=function(){const items=state.draftItems||[],sum=k=>items.reduce((n,x)=>n+num(x[k]),0),formatNut=(k,unit)=>items.length&&items.every(x=>x[k]!==null&&x[k]!==undefined&&String(x[k]).trim()!==""&&Number.isFinite(Number(x[k])))?sum(k).toLocaleString("th-TH",{maximumFractionDigits:1})+" "+unit:"—";return `<div class="subpage meal-review">${header("ตรวจมื้ออาหาร","ตรวจวัตถุดิบและสารอาหารก่อนบันทึก")}<div class="mascot-review-note"><img data-mascot="review" alt="น้อง HELM ถือการ์ดสุขภาพ"><div><strong>ตรวจอาหารในจานก่อนบันทึก</strong><p>${previewMode?"ถ่ายหรือเลือกรูป แล้วเพิ่มอาหารในจานด้วยตนเอง":"ถ่ายหรือเลือกรูป แล้ว HELM จะวิเคราะห์ให้อัตโนมัติ"}</p></div></div><div class="review-photo-wrap"><img class="review-photo" src="${picture()}" alt="รูปอาหารที่กำลังบันทึก"><div class="review-photo-actions"><button type="button" class="solid-button" data-action="review-camera">${icon("camera")} ${state.photo?"ถ่ายรูปใหม่":"ถ่ายรูปอาหาร"}</button><button type="button" class="ghost-button" data-action="review-gallery">${icon("upload")} เลือกรูป</button></div></div><section class="review-summary" aria-label="ตารางแคลอรีและสารอาหาร"><div class="review-kcal"><span>🔥 แคลอรีโดยประมาณ</span><strong>${formatNut("kcal","kcal")}</strong></div><div class="review-macros"><div><span>🍞 คาร์บ</span><strong>${formatNut("carbs","ก.")}</strong></div><div><span>🥩 โปรตีน</span><strong>${formatNut("protein","ก.")}</strong></div><div><span>🧀 ไขมัน</span><strong>${formatNut("fat","ก.")}</strong></div><div><span>🍬 น้ำตาล</span><strong>${formatNut("sugar","ก.")}</strong></div><div><span>🧂 โซเดียม</span><strong>${formatNut("sodium","มก.")}</strong></div><div><span>💛 คอเลสเตอรอล</span><strong>${formatNut("cholesterol","มก.")}</strong></div></div><p class="review-nutrition-note">${items.some(x=>x.source_type==="ai_estimate")?"ค่าประมาณจาก HELM AI • ตรวจแก้ก่อนบันทึก":"ค่าประมาณจากอาหารที่เลือกเอง"} • — คือยังไม่มีข้อมูล</p></section><section class="panel ingredient-panel"><div class="section-head"><div document.addEventListener("click",e=>{const b=e.target.closest("[data-action]");if(!b)return;const a=b.dataset.action;if(a==="water"){state.tab="today";persist();render();$("#water-card")?.scrollIntoView({behavior:"smooth",block:"center"})}else if(a==="water-goal"){modal("เป้าหมายน้ำดื่ม","กำหนดเป้าหมายที่เหมาะกับคุณ",`<form class="wellness-form" id="water-goal-form"><label>เป้าหมายต่อวัน (ml)<input name="waterGoalMl" type="number" min="250" max="10000" step="250" value="${num(state.waterGoalMl)}" required></label><button class="solid-button" type="submit">บันทึกเป้าหมาย</button></form>`)}else if(a==="add-water"||a==="remove-water"){state.waterMl=Math.max(0,num(state.waterMl)+(a==="add-water"?250:-250));if(a==="add-water"&&state.waterReminderEnabled)scheduleWaterReminder();persist();render();$("#water-card")?.scrollIntoView({block:"center"});toast("บันทึกน้ำดื่มแล้ว")}});

function stateForStorage(){const copy=JSON.parse(JSON.stringify(state));copy.photo=null;for(const meal of copy.meals||[])meal.photo=null;return copy}
persist=function(){try{localStorage.setItem(LOCAL_STORAGE_KEY,JSON.stringify(stateForStorage()))}catch{toast("พื้นที่จัดเก็บในเครื่องเต็ม")}};
async function apiCall(action,payload={}){
  if(!cfg.webhookBaseUrl)throw new Error("ยังไม่ได้ตั้งค่า n8n สำหรับเว็บนี้");
  const endpoint=cfg.webhookBaseUrl.replace(/\/$/,"")+"/"+action.replace(".","/");
  const controller=new AbortController();
  const timer=setTimeout(()=>controller.abort(),90000);
  try{
    const response=await fetch(endpoint,{method:"POST",mode:"cors",cache:"no-store",headers:{"Content-Type":"text/plain"},body:JSON.stringify({action,payload}),signal:controller.signal});
    const result=await response.json().catch(()=>({}));
    if(!response.ok||result.ok===false)throw new Error(result.error||`n8n ตอบกลับไม่สำเร็จ (${response.status})`);
    return result;
  }catch(error){if(error.name==="AbortError")throw new Error("HELM ใช้เวลานานเกินไป กรุณาลองอีกครั้ง");throw error}finally{clearTimeout(timer)}
}
function updateDateAndShift(){const date=new Intl.DateTimeFormat("th-TH",{day:"numeric",month:"short",year:"numeric"}).format(new Date());document.querySelectorAll(".today-date").forEach(el=>el.textContent=date);document.querySelectorAll(".shift-pill").forEach(el=>{if(el.lastChild)el.lastChild.textContent=state.shift||"ไม่ระบุ"})}
async function loadApp(){
  try{state={...INITIAL_STATE,...JSON.parse(localStorage.getItem(LOCAL_STORAGE_KEY)||"{}")}}catch{state=JSON.parse(JSON.stringify(INITIAL_STATE))}
  if(!Array.isArray(state.meals))state.meals=[];
  if(!Array.isArray(state.draftItems))state.draftItems=[];
  if(!Array.isArray(state.weightHistory))state.weightHistory=[];
  if(state.trackerDate!==currentDay()){state.waterMl=0;state.steps=0;state.activityKcal=0;state.activityDone=false;state.trackerDate=currentDay()}
  signedIn=true;
  document.querySelector("#auth-root")?.remove();
  document.body.classList.add("authenticated");
  document.querySelectorAll(".sidebar-note").forEach(el=>el.textContent="ข้อมูลส่วนตัวเก็บในเบราว์เซอร์เครื่องนี้");
  updateDateAndShift();render();persist();
}

async function requestAi(path, body) {
  const action = ({"/api/ai/food":"ai.food","/api/ai/activity":"ai.activity"})[path];
  if (!action) throw new Error("ไม่รู้จักคำขอ HELM");
  const result = await apiCall(action, body);
  if (typeof result.answer !== "string" || !result.answer.trim()) throw new Error("HELM ไม่ส่งคำตอบกลับมา");
  return result;
}

function foodDraftFromAnalysis(analysis) {
  if (!analysis || typeof analysis.meal_name !== "string" || !analysis.totals) return null;
  const totals = analysis.totals;
  const required = ["kcal", "protein_g", "carbs_g", "fat_g"];
  if (!required.every(key => typeof totals[key] === "number" && Number.isFinite(totals[key]) && totals[key] >= 0)) return null;
  const optional = key => typeof totals[key] === "number" && Number.isFinite(totals[key]) && totals[key] >= 0 ? totals[key] : null;
  return {name: analysis.meal_name.trim(), kcal: totals.kcal, protein: totals.protein_g,
    carbs: totals.carbs_g, fat: totals.fat_g, sugar: optional("sugar_g"),
    sodium: optional("sodium_mg"), cholesterol: optional("cholesterol_mg"),
    source_type: "ai_estimate"};
}

async function analyzeFoodPhoto(confirmedName = foodConfirmedName) {
  if (previewMode) return;
  if (!signedIn || !state.photo || state.tab !== "review") return;
  const photo = state.photo;
  const epoch = aiEpoch;
  const requestId = ++foodRequestId;
  const isCurrent = () => signedIn && aiEpoch === epoch && foodRequestId === requestId && state.photo === photo && state.tab === "review";
  foodAiBusy = true;
  foodAnalysis = "";
  foodNutrition = null;
  foodEstimateNotice = "";
  foodAnalysisError = "";
  analyzedPhoto = photo;
  render();
  try {
    const notes = confirmedName ? `ผู้ใช้ยืนยันชื่อเมนู: ${confirmedName}` : "";
    const result = await requestAi("/api/ai/food", {photo, notes});
    if (!isCurrent()) return;
    if (confirmedName) {
      const modelName = String(result.nutrition?.meal_name || "").replace(/\s/g, "");
      const userName = confirmedName.replace(/\s/g, "");
      if (!modelName || !(modelName.includes(userName) || userName.includes(modelName))) {
        foodAnalysis = confirmedName;
        foodNutrition = {meal_name: confirmedName, portion: "", assumptions: ["HELM ยังระบุเมนูไม่ตรงกับชื่อที่คุณแก้ จึงไม่เติมค่าสารอาหารอัตโนมัติ"]};
        foodEstimateNotice = "กรุณาตรวจส่วนประกอบและกรอกค่าสารอาหารด้วยตนเอง";
        return;
      }
    }
    foodAnalysis = result.answer;
    foodNutrition = result.nutrition || null;
    const draft = foodDraftFromAnalysis(result.nutrition);
    if (draft) {
      state.draftItems = [draft];
      state.draftName = draft.name;
      foodEstimateNotice = "เติมค่าประมาณลงการ์ดแล้ว กรุณาตรวจปริมาณและแก้ไขก่อนกดบันทึกมื้ออาหาร";
      persist();
    } else {
      if (result.nutrition?.needs_label_check) {
        state.draftItems = (state.draftItems || []).filter(item => item.source_type !== "ai_estimate");
        persist();
        foodEstimateNotice = "ยังยืนยันสูตรหรือฉลากไม่ได้ จึงไม่เติมตัวเลขลงการ์ด กรุณาดูฉลากแล้วกรอกค่าด้วยตนเอง";
      } else {
        foodEstimateNotice = "HELM ยังไม่ส่งตัวเลขครบสำหรับการ์ด กรุณาตรวจผลและกรอกค่าด้วยตนเอง";
      }
    }
  } catch (error) {
    if (isCurrent()) foodAnalysisError = error.message || "เชื่อมต่อ HELM ไม่สำเร็จ";
  } finally {
    if (aiEpoch === epoch && foodRequestId === requestId) {
      foodAiBusy = false;
      if (state.tab === "review") render();
    }
  }
}

document.addEventListener("helm:photo-ready", () => { foodConfirmedName = ""; void analyzeFoodPhoto(); });

document.addEventListener("submit", async event => {
  if (event.target.id !== "ai-food-correction-form") return;
  event.preventDefault();
  if (previewMode || !signedIn || foodAiBusy) return;
  const name = event.target.elements.mealName.value.trim();

  state.draftName = name;
  state.draftItems = (state.draftItems || []).filter(item => item.source_type !== "ai_estimate");

});

document.addEventListener("click", async event => {
  const button = event.target.closest('[data-action="ai-food"], [data-action="ai-activity"]');
  if (!button || previewMode || !signedIn) return;
  const epoch = aiEpoch;
  if (button.dataset.action === "ai-food") {
    if (foodAiBusy) return;
    await analyzeFoodPhoto();
  } else {
    if (activityAiBusy) return;
    const weight = Number(state.weightKg);
    const context = {
      steps: Number(state.steps) > 0 ? Math.round(Number(state.steps)) : null,
      shift: String(state.shift || "ไม่ระบุ"),
      activity: String(state.activity || ""),
      duration: Math.round(Number(state.duration) || 0),
      activityDone: state.activityDone === true,
      weightKg: weight >= 20 && weight <= 500 ? weight : null,
    };
    activityAiBusy = true;
    activityAnalysis = "";
    render();
    try {
      const result = await requestAi("/api/ai/activity", {context});
      if (signedIn && aiEpoch === epoch) activityAnalysis = result.answer;
    } catch (error) {
      if (signedIn && aiEpoch === epoch) toast(error.message || "เชื่อมต่อ HELM ไม่สำเร็จ");
    } finally {
      if (aiEpoch === epoch) {
        activityAiBusy = false;
        if (state.tab === "activity") render();
      }
    }
  }
});

// Authenticated trainer chat. The browser talks only to this application's server.
const trainerMessages = [];
let trainerBusy = false;
let trainerEpoch = 0;
let trainerPendingPhoto = "";
let trainerPhotoLoading = false;
const originalRender = render;
const originalLoadApp = loadApp;
loadApp = async function (username) {
  trainerEpoch += 1;
  trainerMessages.length = 0;
  trainerBusy = false;
  trainerPendingPhoto = "";
  trainerPhotoLoading = false;
  return originalLoadApp(username);
};
document.addEventListener("click", event => {
  if (event.target.closest('[data-action="logout"]')) {
    trainerEpoch += 1;
    trainerMessages.length = 0;
    trainerBusy = false;
    trainerPendingPhoto = "";
    trainerPhotoLoading = false;
  }
}, true);

navHTML = function () {
  return [
    ["today", "home", "วันนี้"],
    ["food", "food", "อาหาร"],
    ["wheel", "wheel", "กินอะไรดี"],
    ["activity", "run", "กิจกรรม"],
    ["trainer", "coach", "เทรนเนอร์"],
    ["profile", "user", "ฉัน"],
  ].map(([key, name, label]) => `<button type="button" data-action="nav" data-tab="${key}" class="${state.tab === key ? "active" : ""}" aria-current="${state.tab === key ? "page" : "false"}">${icon(name)}<span>${label}</span></button>`).join("");
};

function trainerInline(text) {
  return esc(text)
    .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
    .replace(/`([^`]+)`/g, "<code>$1</code>");
}

function trainerAnswerHtml(content) {
  // HELM sometimes puts emoji bullets in one paragraph. Separate them before rendering.
  const prepared = String(content || "").replace(/\r\n?/g, "\n")
    .replace(/([^\n])\s+[-•]\s+(?=[\u2600-\u27BF\u{1F300}-\u{1FAFF}])/gu, "$1\n- ");
  const blocks = [];
  let list = [];
  let listTag = "";
  const flushList = () => {
    if (list.length) blocks.push(`<${listTag}>${list.map(item => `<li>${trainerInline(item)}</li>`).join("")}</${listTag}>`);
    list = [];
    listTag = "";
  };
  for (const raw of prepared.split("\n")) {
    const line = raw.trim();
    if (!line) { flushList(); continue; }
    const bullet = line.match(/^[-•*]\s+(.+)$/);
    const numbered = line.match(/^\d+[.)]\s+(.+)$/);
    if (bullet || numbered) {
      const tag = numbered ? "ol" : "ul";
      if (listTag && listTag !== tag) flushList();
      listTag = tag;
      list.push((bullet || numbered)[1]);
    } else {
      flushList();
      blocks.push(`<p>${trainerInline(line)}</p>`);
    }
  }
  flushList();
  return blocks.join("");
}

function trainerPage() {
  return `<div class="trainer-page" aria-label="แชต AI เทรนเนอร์">
    <div class="trainer-heading"><span class="trainer-heading-mark">${icon("coach")}</span><div><h1>AI เทรนเนอร์</h1><p>คุยเรื่องการออกกำลังกายกับ HELM</p></div></div>
    <div id="trainer-chat" class="trainer-chat" role="log" aria-live="polite">${trainerMessages.map(message =>
      `<div class="trainer-message ${message.role}">${message.role === "assistant" ? trainerAnswerHtml(message.content) : `<p>${esc(message.content)}</p>${message.photo ? `<img class="trainer-message-photo" src="${esc(message.photo)}" alt="รูปอาหารที่ส่งให้ HELM">` : ""}`}</div>`).join("")}${trainerBusy ? '<div class="trainer-message assistant" role="status"><p>HELM กำลังตอบ…</p></div>' : ""}</div>
    ${trainerPendingPhoto ? `<div class="trainer-photo-preview"><img src="${esc(trainerPendingPhoto)}" alt="รูปอาหารที่จะแนบ"><span>รูปอาหารพร้อมส่ง</span><button type="button" data-action="trainer-remove-photo" aria-label="ลบรูปที่แนบ">×</button></div>` : ""}
    <form id="trainer-form" class="trainer-compose"><button class="trainer-attach" type="button" data-action="trainer-camera" aria-label="ถ่ายรูปอาหาร" title="ถ่ายรูปอาหาร" ${previewMode || trainerBusy || trainerPhotoLoading ? "disabled" : ""}>${icon("camera")}</button><button class="trainer-attach" type="button" data-action="trainer-gallery" aria-label="เลือกรูปอาหาร" title="เลือกรูปอาหาร" ${previewMode || trainerBusy || trainerPhotoLoading ? "disabled" : ""}>${icon("upload")}</button><input name="message" type="text" maxlength="1000" autocomplete="off" aria-label="พิมพ์คำถามถึง AI เทรนเนอร์" placeholder="${previewMode ? "โหมดทดลองยังไม่เชื่อม HELM AI" : "ถาม HELM หรือแนบรูปอาหาร…"}" ${previewMode ? "disabled" : ""}><button class="trainer-send" type="submit" aria-label="ส่งข้อความ" ${previewMode || trainerBusy || trainerPhotoLoading ? "disabled" : ""}>${icon("send")}</button><input id="trainer-camera-input" class="trainer-file-input" type="file" accept="image/*" capture="environment" aria-label="ถ่ายรูปอาหาร"><input id="trainer-gallery-input" class="trainer-file-input" type="file" accept="image/*" aria-label="เลือกรูปอาหาร"></form>
    <p class="trainer-note">${previewMode ? "โหมดทดลอง • เปิดแชตได้เมื่อเชื่อมบัญชีบริษัทและ HELM AI" : "คำแนะนำทั่วไป • หากเจ็บหรือมีอาการผิดปกติ ให้หยุดกิจกรรม"}</p>
  </div>`;
}

render = function () {
  if (state.tab !== "trainer") return originalRender();
  $("#main").innerHTML = trainerPage();
  $("#side-nav").innerHTML = navHTML();
  $("#bottom-nav").innerHTML = navHTML();
  document.querySelectorAll("[data-icon]").forEach(element => element.innerHTML = icon(element.dataset.icon));
  document.title = "AI เทรนเนอร์ • HELM Longevity";
  window.scrollTo(0, 0);
};

document.addEventListener("click", event => {
  const action = event.target.closest("[data-action]")?.dataset.action;
  if (action === "trainer-camera" || action === "trainer-gallery") {
    if (!trainerBusy && !trainerPhotoLoading) $(action === "trainer-camera" ? "#trainer-camera-input" : "#trainer-gallery-input")?.click();
  } else if (action === "trainer-remove-photo") {
    trainerPendingPhoto = "";
    if (state.tab === "trainer") render();
  }
});

function readTrainerPhoto(file) {
  return new Promise((resolve, reject) => {
    if (!file.type.startsWith("image/") || file.size > 15_000_000) return reject(new Error("กรุณาเลือกรูปภาพขนาดไม่เกิน 15 MB"));
    const reader = new FileReader();
    reader.onerror = () => reject(new Error("อ่านรูปภาพไม่ได้ กรุณาลองใหม่"));
    reader.onload = () => {
      const image = new Image();
      image.onerror = () => reject(new Error("เปิดรูปภาพไม่ได้ กรุณาเลือกรูปอื่น"));
      image.onload = () => {
        const scale = Math.min(1, 1000 / Math.max(image.width, image.height));
        const canvas = document.createElement("canvas");
        canvas.width = Math.max(1, Math.round(image.width * scale));
        canvas.height = Math.max(1, Math.round(image.height * scale));
        canvas.getContext("2d").drawImage(image, 0, 0, canvas.width, canvas.height);
        const photo = canvas.toDataURL("image/jpeg", .76);
        if (photo.length > 1_200_000) return reject(new Error("รูปภาพใหญ่เกินไป กรุณาเลือกรูปอื่น"));
        resolve(photo);
      };
      image.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}

document.addEventListener("change", async event => {
  if (event.target.id !== "trainer-camera-input" && event.target.id !== "trainer-gallery-input") return;
  const file = event.target.files?.[0];
  if (!file || trainerBusy) return;
  const epoch = trainerEpoch;
  trainerPhotoLoading = true;
  try {
    const photo = await readTrainerPhoto(file);
    if (epoch === trainerEpoch && signedIn) trainerPendingPhoto = photo;
  } catch (error) {
    if (epoch === trainerEpoch) toast(error.message || "แนบรูปภาพไม่สำเร็จ");
  } finally {
    if (epoch === trainerEpoch) {
      trainerPhotoLoading = false;
      if (state.tab === "trainer") render();
    }
  }
});

document.addEventListener("submit", async event => {
  if (event.target.id !== "trainer-form") return;
  event.preventDefault();
  if (previewMode || trainerBusy || !signedIn) return;
  const photo = trainerPendingPhoto;
  const text = event.target.elements.message.value.trim() || (photo ? "ช่วยดูรูปอาหารนี้และบอกสิ่งที่เห็นกับข้อจำกัดของการประเมิน" : "");
  if (!text || trainerPhotoLoading) return;
  trainerMessages.push({role: "user", content: text, photo});
  trainerPendingPhoto = "";
  const epoch = trainerEpoch;
  trainerBusy = true;
  render();
  try {
    const history = trainerMessages.filter(item => item.role === "user" || item.role === "assistant")
      .slice(-12).map(item => ({role: item.role, content: item.role === "assistant" ? item.content.slice(0, 12000) : item.content}));
    const result = await apiCall("ai.trainer", {messages: history, ...(photo ? {photo} : {})});
    if (!signedIn || epoch !== trainerEpoch) return;
    if (typeof result.answer !== "string" || !result.answer.trim()) throw new Error("HELM ไม่ส่งคำตอบกลับมา");
    trainerMessages.push({role: "assistant", content: result.answer});
  } catch (error) {
    if (signedIn && epoch === trainerEpoch) trainerMessages.push({role: "system", content: error.message || "เชื่อมต่อ HELM ไม่สำเร็จ"});
  } finally {
    if (epoch !== trainerEpoch) return;
    trainerBusy = false;
    if (state.tab === "trainer") {
      render();
      window.scrollTo(0, document.documentElement.scrollHeight);
    }
  }
});

bootstrap();
</script>
